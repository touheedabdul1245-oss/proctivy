<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>PROCTIFY — Exams</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <script src="https://unpkg.com/lucide@latest"></script>

    <style>

        .exams-page {
            max-width: 1200px;
            margin: 0 auto;
        }

        .exam-list {
            display: grid;
            grid-template-columns:
                repeat(auto-fill, minmax(280px, 1fr));
            gap: 18px;
            margin-top: 25px;
        }

        .exam-list-card {
            background: rgba(255,255,255,.82);
            border: 1px solid rgba(80,80,80,.08);
            border-radius: 22px;
            padding: 22px;
            box-shadow:
                0 12px 30px rgba(70,70,60,.06);
            transition: .2s ease;
        }

        .exam-list-card:hover {
            transform: translateY(-3px);
            box-shadow:
                0 18px 35px rgba(70,70,60,.10);
        }

        .exam-card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }

        .exam-icon {
            width: 42px;
            height: 42px;
            border-radius: 14px;
            background: #eee9f5;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #76658f;
        }

        .exam-status {
            font-size: 8px;
            font-weight: 700;
            letter-spacing: 1px;
            padding: 6px 9px;
            border-radius: 20px;
        }

        .exam-status.active {
            background: #dcefe7;
            color: #37745e;
        }

        .exam-status.completed {
            background: #eeeeea;
            color: #77776f;
        }

        .exam-status.scheduled {
            background: #e6efff;
            color: #3a5fa8;
        }

        .exam-name {
            font-size: 18px;
            font-weight: 700;
            color: #292927;
        }

        .exam-subject {
            margin-top: 5px;
            font-size: 11px;
            color: #8a8a82;
        }

        .exam-meta {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            margin-top: 18px;
        }

        .exam-meta-item {
            font-size: 10px;
            color: #77776f;
        }

        .exam-meta-item strong {
            color: #292927;
        }

        .exam-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .view-exam-btn {
            border: none;
            border-radius: 11px;
            padding: 10px 15px;
            background: #292927;
            color: white;
            font-size: 10px;
            font-weight: 700;
            cursor: pointer;
        }

        .view-exam-btn.secondary {
            background: #ecece7;
            color: #292927;
        }

        .view-exam-btn.danger {
            background: #b8342c;
            color: #fff;
        }

        .view-exam-btn:hover {
            transform: translateY(-1px);
        }

        .exam-status.expired {
            background: #f7e3e1;
            color: #a1221c;
        }

        .empty-exams {
            margin-top: 30px;
            padding: 45px 20px;
            text-align: center;
            border: 1px dashed #d8d8d0;
            border-radius: 20px;
            color: #999990;
            font-size: 12px;
        }

    </style>

</head>


<body>

<div class="background-art">

    <div class="blob blob-one"></div>
    <div class="blob blob-two"></div>
    <div class="blob blob-three"></div>

</div>


<div class="exams-page">

    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="topbar">

        <div>

            <div class="eyebrow">
                EXAM MANAGEMENT
            </div>

            <h1>
                Available Exams
            </h1>

            <p class="subtitle">
                Create, review, clear and delete examinations.
            </p>

        </div>


        <div class="top-right">

            <a class="view-exam-btn secondary"
               href="/teacher"
               style="text-decoration:none;display:inline-flex;align-items:center">
                ← Dashboard
            </a>

            <a class="view-exam-btn"
               href="/host-exam"
               style="text-decoration:none;display:inline-flex;align-items:center;margin-left:8px">
                + Host Exam
            </a>

        </div>

    </header>


    <!-- =====================================================
         EXAM LIST
    ====================================================== -->

    <section>

        <div
            id="examList"
            class="exam-list">

        </div>


        <div
            id="emptyExams"
            class="empty-exams"
            style="display:none;">

            No exams have been created yet.

        </div>

    </section>

</div>


<script>

lucide.createIcons();


/* =========================================================
   LOAD EXAMS
========================================================= */

async function loadExams() {

    const examList =
        document.getElementById(
            "examList"
        );

    const emptyExams =
        document.getElementById(
            "emptyExams"
        );


    try {

        const response =
            await fetch(
                "/api/exams",
                {
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "Unable to load exams"
            );

        }


        const data =
            await response.json();


        if (
            !data ||
            data.success !== true ||
            !Array.isArray(data.exams)
        ) {

            throw new Error(
                "Invalid exam data"
            );

        }


        examList.innerHTML = "";


        if (data.exams.length === 0) {

            emptyExams.style.display =
                "block";

            return;

        }


        emptyExams.style.display =
            "none";


        data.exams.forEach(
            exam => {

                const card =
                    document.createElement(
                        "div"
                    );

                card.className =
                    "exam-list-card";


                const status =
                    String(
                        exam.status ||
                        "UNKNOWN"
                    ).toUpperCase();


                const statusClass =
                    status === "ACTIVE"
                        ? "active"
                        : status === "COMPLETED"
                            ? "completed"
                            : status === "EXPIRED"
                                ? "expired"
                                : "scheduled";


                card.innerHTML = `

                    <div class="exam-card-top">

                        <div class="exam-icon">

                            <i
                                data-lucide="file-text">
                            </i>

                        </div>

                        <span
                            class="exam-status ${statusClass}">
                            ${escapeHTML(status)}
                        </span>

                    </div>


                    <div class="exam-name">
                        ${escapeHTML(
                            exam.exam_name ||
                            "Untitled Exam"
                        )}
                    </div>


                    <div class="exam-subject">
                        ${escapeHTML(
                            exam.subject ||
                            "No subject"
                        )}
                    </div>


                    <div class="exam-meta">

                        <div class="exam-meta-item">

                            <strong>
                                ${exam.question_count || 0}
                            </strong>

                            questions

                        </div>


                        <div class="exam-meta-item">

                            <strong>
                                ${exam.duration || 0}
                            </strong>

                            min

                        </div>


                        <div class="exam-meta-item">

                            <strong>
                                ${exam.assigned_count || 0}
                            </strong>

                            assigned

                        </div>


                        <div class="exam-meta-item">

                            <strong>
                                ${exam.submission_count || 0}
                            </strong>

                            submitted

                        </div>

                    </div>


                    <div class="exam-actions">

                        <button
                            class="view-exam-btn secondary"
                            onclick="clearExamData(
                                '${escapeJS(
                                    exam.exam_id
                                )}'
                            )">

                            Clear Data

                        </button>


                        <button
                            class="view-exam-btn danger"
                            onclick="deleteExam(
                                '${escapeJS(
                                    exam.exam_id
                                )}',
                                '${escapeJS(
                                    exam.exam_name || ""
                                )}'
                            )">

                            Delete

                        </button>


                        <button
                            class="view-exam-btn"
                            onclick="viewExam(
                                '${escapeJS(
                                    exam.exam_id
                                )}'
                            )">

                            View Exam →

                        </button>

                    </div>

                `;


                examList.appendChild(
                    card
                );

            }
        );


        lucide.createIcons();

    }


    catch (error) {

        console.error(
            "Exam loading error:",
            error
        );


        examList.innerHTML = `

            <div class="empty-exams"
                 style="display:block;">

                Unable to load exams.

            </div>

        `;

    }

}


/* =========================================================
   VIEW EXAM
========================================================= */

function viewExam(examId) {

    if (!examId) {
        return;
    }

    window.location.href =
        "/exam/" +
        encodeURIComponent(
            examId
        );

}


/* =========================================================
   DELETE EXAM
   Removes the exam plus every session, violation, evidence
   image and submission it produced.
========================================================= */

async function deleteExam(examId, examName) {

    if (!examId) return;

    const confirmed = window.confirm(
        "Delete \"" + (examName || examId) + "\"?\n\n" +
        "This permanently removes the exam, its assignments, every " +
        "monitoring session, all violations, all evidence images and " +
        "all submissions for this exam."
    );

    if (!confirmed) return;

    try {

        const response = await fetch(
            "/api/exams/" + encodeURIComponent(examId),
            { method: "DELETE" }
        );

        const data = await response.json();

        if (!response.ok || !data.success) {

            throw new Error(data.error || "Unable to delete exam");

        }

        const removed = data.deleted || {};

        window.alert(
            "Exam deleted.\n\n" +
            "Sessions: " + (removed.sessions || 0) + "\n" +
            "Violations: " + (removed.violations || 0) + "\n" +
            "Evidence: " + (removed.evidence || 0) + "\n" +
            "Evidence images: " + (removed.files || 0) + "\n" +
            "Submissions: " + (removed.submissions || 0)
        );

        loadExams();

    }

    catch (error) {

        window.alert(error.message);

    }

}


/* =========================================================
   CLEAR EXAM DATA
   Keeps the exam, wipes only what was recorded during it.
========================================================= */

async function clearExamData(examId) {

    if (!examId) return;

    if (!window.confirm(
        "Clear all recorded data (sessions, violations, evidence " +
        "images and submissions) for this exam?\n\nThe exam itself " +
        "is kept."
    )) return;

    try {

        const response = await fetch(
            "/api/exams/" + encodeURIComponent(examId) + "/clear-data",
            { method: "POST" }
        );

        const data = await response.json();

        if (!response.ok || !data.success) {

            throw new Error(data.error || "Unable to clear exam data");

        }

        const cleared = data.cleared || {};

        window.alert(
            "Exam data cleared.\n\n" +
            "Sessions: " + (cleared.sessions || 0) + "\n" +
            "Violations: " + (cleared.violations || 0) + "\n" +
            "Evidence: " + (cleared.evidence || 0) + "\n" +
            "Submissions: " + (cleared.submissions || 0)
        );

        loadExams();

    }

    catch (error) {

        window.alert(error.message);

    }

}

/* =========================================================
   HTML ESCAPING
========================================================= */

function escapeHTML(value) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


function escapeJS(value) {

    return String(value)
        .replace(
            /\\/g,
            "\\\\"
        )
        .replace(
            /'/g,
            "\\'"
        );

}


/* =========================================================
   INITIAL LOAD
========================================================= */

loadExams();
document.addEventListener("visibilitychange", function () {

    console.log(
        "PROCTIFY TAB TEST:",
        document.visibilityState
    );

});
</script>


</body>

</html>
