
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>PROCTIFY — Examination</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <style>

        body {
            margin: 0;
        }

        .exam-page {
            min-height: 100vh;
            padding: 28px;
            box-sizing: border-box;
        }

        .exam-container {
            max-width: 1050px;
            margin: 0 auto;
        }

        /* =====================================================
           HEADER
        ===================================================== */

        .exam-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            padding: 18px 22px;
            background: rgba(255,255,255,.82);
            border: 1px solid rgba(100,100,100,.08);
            border-radius: 20px;
            backdrop-filter: blur(14px);
        }

        .exam-header-left {
            min-width: 0;
        }

        .exam-eyebrow {
            font-size: 8px;
            letter-spacing: 1.5px;
            color: #999990;
            margin-bottom: 5px;
        }

        .exam-title {
            font-size: 20px;
            font-weight: 700;
            color: #292927;
        }

        .exam-subject {
            margin-top: 4px;
            font-size: 10px;
            color: #8b8b83;
        }

        /* =====================================================
           TIMER
        ===================================================== */

        .exam-timer {
            min-width: 110px;
            text-align: center;
            padding: 10px 15px;
            border-radius: 15px;
            background: #292927;
            color: white;
        }

        .timer-label {
            font-size: 7px;
            letter-spacing: 1px;
            opacity: .65;
        }

        .timer-value {
            margin-top: 3px;
            font-size: 19px;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }

        .timer-warning {
            background: #8d5b4d;
        }

        /* =====================================================
           EXAM CONTENT
        ===================================================== */

        .exam-workspace {
            margin-top: 22px;
            display: grid;
            grid-template-columns: 1fr 250px;
            gap: 20px;
            align-items: start;
        }

        .question-card,
        .navigation-card {
            background: rgba(255,255,255,.88);
            border: 1px solid rgba(100,100,100,.08);
            border-radius: 22px;
            backdrop-filter: blur(14px);
        }

        .question-card {
            padding: 30px;
        }

        .question-number {
            font-size: 9px;
            letter-spacing: 1.3px;
            color: #8d8d85;
            margin-bottom: 14px;
        }

        .question-text {
            font-size: 21px;
            line-height: 1.45;
            font-weight: 600;
            color: #292927;
        }

        /* =====================================================
           OPTIONS
        ===================================================== */

        .options {
            margin-top: 28px;
            display: grid;
            gap: 11px;
        }

        .option {

            display: flex;
            align-items: center;
            gap: 13px;

            width: 100%;
            box-sizing: border-box;

            padding: 15px;

            border: 1px solid #deded8;
            border-radius: 14px;

            background: rgba(250,250,247,.8);

            cursor: pointer;

            transition:
                border-color .2s ease,
                background .2s ease,
                transform .2s ease;
        }

        .option:hover {
            transform: translateY(-1px);
            border-color: #aaa2b7;
        }

        .option.selected {
            border-color: #807196;
            background: #f0ecf4;
        }

        .option-letter {
            width: 32px;
            height: 32px;
            flex-shrink: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 10px;

            background: #eeeeea;
            color: #68685f;

            font-size: 11px;
            font-weight: 700;
        }

        .option.selected .option-letter {
            background: #807196;
            color: white;
        }

        .option-text {
            font-size: 12px;
            color: #454540;
        }

        /* =====================================================
           NAVIGATION
        ===================================================== */

        .navigation-card {
            padding: 20px;
        }

        .navigation-title {
            font-size: 9px;
            letter-spacing: 1.2px;
            color: #8d8d85;
            margin-bottom: 14px;
        }

        .question-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
        }

        .question-button {
            width: 34px;
            height: 34px;

            border: 1px solid #deded8;
            border-radius: 9px;

            background: #fafaf7;
            color: #66665f;

            font-size: 10px;
            cursor: pointer;
        }

        .question-button.current {
            background: #292927;
            color: white;
            border-color: #292927;
        }

        .question-button.answered {
            background: #e0f0e9;
            border-color: #c3dfd2;
            color: #39725f;
        }

        /* =====================================================
           ACTIONS
        ===================================================== */

        .question-actions {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-top: 28px;
        }

        .exam-action {
            padding: 12px 18px;
            border: none;
            border-radius: 11px;
            font-family: inherit;
            font-size: 10px;
            font-weight: 700;
            cursor: pointer;
        }

        .previous-button {
            background: #eeeeea;
            color: #55554f;
        }

        .next-button {
            background: #292927;
            color: white;
        }

        .submit-button {
            width: 100%;
            margin-top: 22px;
            padding: 13px;
            border: none;
            border-radius: 12px;
            background: #292927;
            color: white;
            font-family: inherit;
            font-size: 10px;
            font-weight: 700;
            cursor: pointer;
        }

        .submit-button:hover,
        .next-button:hover,
        .exam-action:hover {
            transform: translateY(-1px);
        }

        /* =====================================================
           STATUS
        ===================================================== */

        .exam-status {
            margin-top: 14px;
            font-size: 9px;
            text-align: center;
            color: #999990;
        }

        .loading-state {
            padding: 70px 20px;
            text-align: center;
            color: #888880;
        }

        .error-state {
            padding: 50px 20px;
            text-align: center;
            color: #8a4d4d;
        }

        /* =====================================================
           RESPONSIVE
        ===================================================== */

        @media(max-width: 800px) {

            .exam-workspace {
                grid-template-columns: 1fr;
            }

            .navigation-card {
                order: 2;
            }

            .exam-header {
                align-items: flex-start;
                flex-direction: column;
            }

            .exam-timer {
                width: 100%;
                box-sizing: border-box;
            }

        }

        .trust-badge {
            position: fixed;
            top: 18px;
            right: 18px;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            z-index: 9999;
            color: #fff;
            box-shadow: 0 4px 12px rgba(0,0,0,.2);
            transition: background .3s;
        }

        .trust-low { background: #dc2626; }
        .trust-mid { background: #f59e0b; }
        .trust-ok  { background: #16a34a; }

        .violation-toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            max-width: 340px;
            padding: 14px 18px;
            border-radius: 12px;
            background: #1e1e2f;
            color: #fff;
            font-size: 13px;
            z-index: 10000;
            box-shadow: 0 6px 20px rgba(0,0,0,.35);
            opacity: 0;
            transform: translateY(20px);
            transition: opacity .3s, transform .3s;
            pointer-events: none;
        }

        .violation-toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        .violation-toast .vt-label {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: .08em;
            text-transform: uppercase;
            color: #f87171;
            margin-bottom: 4px;
        }

        .violation-toast .vt-text {
            line-height: 1.4;
        }

    </style>

</head>


<body>


<div id="trustBadge" class="trust-badge trust-ok"
     style="display:none">
    TRUST: <span id="trustValue">100</span>
</div>

<div id="violationToast" class="violation-toast">
    <div class="vt-label">PROCTIFY WARNING</div>
    <div class="vt-text" id="violationText"></div>
</div>

<div class="background-art">

    <div class="blob blob-one"></div>
    <div class="blob blob-two"></div>
    <div class="blob blob-three"></div>

</div>


<div class="exam-page">

    <div class="exam-container">


        <!-- =================================================
             EXAM HEADER
        ================================================== -->

        <header class="exam-header">

            <div class="exam-header-left">

                <div class="exam-eyebrow">
                    PROCTIFY / LIVE EXAMINATION
                </div>

                <div
                    id="examTitle"
                    class="exam-title">

                    Loading examination...

                </div>

                <div
                    id="examSubject"
                    class="exam-subject">

                </div>

            </div>


            <div
                id="examTimer"
                class="exam-timer">

                <div class="timer-label">
                    TIME REMAINING
                </div>

                <div
                    id="timerValue"
                    class="timer-value">

                    --:--

                </div>

            </div>

        </header>


        <!-- =================================================
             WORKSPACE
        ================================================== -->

        <main
            id="examWorkspace"
            class="exam-workspace"
            style="display:none;">


            <!-- =================================================
                 QUESTION
            ================================================== -->

            <section class="question-card">

                <div
                    id="questionNumber"
                    class="question-number">

                </div>


                <div
                    id="questionText"
                    class="question-text">

                </div>


                <div
                    id="options"
                    class="options">

                </div>


                <div class="question-actions">

                    <button
                        id="previousButton"
                        class="exam-action previous-button"
                        onclick="previousQuestion()">

                        ← Previous

                    </button>


                    <button
                        id="nextButton"
                        class="exam-action next-button"
                        onclick="nextQuestion()">

                        Next →

                    </button>

                </div>

            </section>


            <!-- =================================================
                 QUESTION NAVIGATION
            ================================================== -->

            <aside class="navigation-card">

                <div class="navigation-title">
                    QUESTIONS
                </div>


                <div
                    id="questionButtons"
                    class="question-buttons">

                </div>


                <button
                    class="submit-button"
                    onclick="submitExam()">

                    Submit Exam

                </button>


                <div
                    id="examStatus"
                    class="exam-status">

                    No answers selected

                </div>

            </aside>

        </main>


        <!-- =================================================
             LOADING
        ================================================== -->

        <div
            id="loadingState"
            class="loading-state">

            Loading examination...

        </div>


    </div>

</div>


<script>


/* =========================================================
   EXAM DATA
========================================================= */

const examId =
    "{{ exam_id }}";

const STUDENT_AGENT_URL =
    "{{ student_agent_url }}";


let exam = null;

let questions = [];

let currentQuestion = 0;

let answers = {};

let remainingSeconds = 0;

let timerInterval = null;

let lastViolationTimestamp = "";

let trustPollInterval = null;

function updateTrustBadge(score) {
    const badge =
        document.getElementById("trustBadge");
    const val =
        document.getElementById("trustValue");

    if (score === null || score === undefined) {
        badge.style.display = "none";
        return;
    }

    badge.style.display = "block";
    val.textContent = score;

    badge.className = "trust-badge";
    if (score <= 30) {
        badge.classList.add("trust-low");
    } else if (score < 80) {
        badge.classList.add("trust-mid");
    } else {
        badge.classList.add("trust-ok");
    }
}

function showViolationToast(text) {
    const toast =
        document.getElementById("violationToast");
    const vtText =
        document.getElementById("violationText");

    vtText.textContent = text;
    toast.classList.add("show");

    setTimeout(function() {
        toast.classList.remove("show");
    }, 5000);
}

async function pollViolations() {
    try {
        const url =
            "/api/student/live/violations"
            + (lastViolationTimestamp
                ? "?since="
                  + encodeURIComponent(
                      lastViolationTimestamp
                    )
                : "");

        const res = await fetch(url);
        const data = await res.json();

        if (!data.success) return;

        if (data.trust_score !== null &&
            data.trust_score !== undefined) {
            updateTrustBadge(data.trust_score);
        }

        if (data.terminated) {
            updateTrustBadge(0);
            clearInterval(trustPollInterval);
            showViolationToast(
                "Exam terminated — Trust Score reached 0."
            );
            return;
        }

        if (data.violations &&
            data.violations.length > 0) {

            const latest = data.violations[0];

            if (latest.timestamp &&
                latest.timestamp !==
                    lastViolationTimestamp) {

                lastViolationTimestamp =
                    latest.timestamp;

                const label =
                    (latest.violation_type || "Violation")
                    .replace(/_/g, " ");

                const penalty =
                    latest.penalty
                    ? " (-" + latest.penalty + ")"
                    : "";

                showViolationToast(
                    label + penalty +
                    "\nTrust Score: "
                    + (data.trust_score || "—")
                );
            }
        }
    } catch (err) {
        console.error("Violation poll error:", err);
    }
}

function startViolationPolling() {
    pollViolations();
    trustPollInterval = setInterval(
        pollViolations, 3000
    );
}

/* =========================================================
   TAB MONITORING
========================================================= */

let examStarted = false;
let tabViolationCount = 0;
let lastTabViolationTime = 0;

const TAB_VIOLATION_COOLDOWN = 3;


/*
 * Send a tab-switch event to the PROCTIFY backend.
 */

async function reportTabSwitch() {

    const now = Date.now();

    /*
     * Prevent duplicate events caused by
     * browser visibility/focus events firing
     * close together.
     */

    if (
        now - lastTabViolationTime <
        TAB_VIOLATION_COOLDOWN * 1000
    ) {
        return;
    }

    lastTabViolationTime = now;

    tabViolationCount++;

    console.warn(
        "PROCTIFY: TAB SWITCH DETECTED"
    );


    try {

        await fetch(
            "/api/exams/" +
            encodeURIComponent(
                examId
            ) +
            "/tab-switch",
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    event:
                        "TAB_SWITCH",

                    timestamp:
                        new Date().toISOString(),

                    count:
                        tabViolationCount
                })
            }
        );

    }

    catch (error) {

        console.error(
            "Unable to report tab switch:",
            error
        );
    }
}


/*
 * Detect when the examination tab
 * becomes hidden.
 */

document.addEventListener(
    "visibilitychange",
    function () {

        if (
            !examStarted
        ) {
            return;
        }


        if (
            document.visibilityState ===
            "hidden"
        ) {

            reportTabSwitch();

        }

    }
);


/*
 * Also monitor browser window focus.
 */

window.addEventListener(
    "blur",
    function () {

        if (
            !examStarted
        ) {
            return;
        }


        /*
         * visibilitychange is the primary
         * signal. blur alone can happen for
         * other reasons, so only report when
         * the document is actually hidden.
         */

        if (
            document.visibilityState ===
            "hidden"
        ) {

            reportTabSwitch();

        }

    }
);


/* =========================================================
   LOAD EXAM
========================================================= */

async function loadExam() {

    try {

        const response =
            await fetch(
                "/api/exams/" +
                encodeURIComponent(
                    examId
                ),
                {
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "Unable to load examination."
            );

        }


        const data =
            await response.json();


        if (
            !data ||
            !data.success ||
            !data.exam
        ) {

            throw new Error(
                "Invalid examination data."
            );

        }


        exam =
            data.exam;


        questions =
            Array.isArray(
                exam.questions
            )
                ? exam.questions
                : [];


        if (
            questions.length === 0
        ) {

            throw new Error(
                "This examination has no questions."
            );

        }


        /*
         * Don't allow a completed exam
         * to be started.
         */

        if (
            String(
                exam.status || ""
            ).toUpperCase() !==
            "ACTIVE"
        ) {

            throw new Error(
                "This examination is no longer active."
            );

        }


        /*
         * Revalidate with server: has this student
         * already submitted or been terminated?
         * Catches bfcache restores and stale pages.
         */
        try {
            var statusRes = await fetch(
                "/api/student/exam/" +
                encodeURIComponent(examId) +
                "/status",
                { cache: "no-store" }
            );
            if (statusRes.ok) {
                var statusData =
                    await statusRes.json();
                if (statusData.submitted) {
                    window.location.href = "/student";
                    return;
                }
            }
        } catch (statusErr) {
            /* If status check fails, continue loading */
        }


        document.getElementById(
            "examTitle"
        ).innerText =
            exam.exam_name ||
            "Examination";


        document.getElementById(
            "examSubject"
        ).innerText =
            exam.subject ||
            "";


        /*
         * The examination timer must be based on the actual
         * MySQL schedule, not on created_at.
         *
         * created_at only tells us when the teacher created
         * the exam. scheduled_end is the real deadline.
         */
        const scheduledEndTime =
            new Date(
                exam.scheduled_end
            ).getTime();


        if (
            Number.isNaN(
                scheduledEndTime
            )
        ) {

            throw new Error(
                "Invalid examination end time."
            );

        }


        remainingSeconds =
            Math.max(
                0,
                Math.ceil(
                    (
                        scheduledEndTime -
                        Date.now()
                    ) / 1000
                )
            );


        /*
         * If the scheduled end time has already passed,
         * do not allow the student to continue.
         */
        if (
            remainingSeconds <= 0
        ) {

            throw new Error(
                "This examination has ended."
            );

        }


        buildQuestionButtons();

        showQuestion();

        examStarted = true;

        startTimer();

        startViolationPolling();


        document.getElementById(
            "loadingState"
        ).style.display =
            "none";


        document.getElementById(
            "examWorkspace"
        ).style.display =
            "grid";

    }


    catch (error) {

        console.error(
            "Exam loading error:",
            error
        );


        document.getElementById(
            "loadingState"
        ).className =
            "error-state";


        document.getElementById(
            "loadingState"
        ).innerText =
            error.message ||
            "Unable to load examination.";

    }

}


/* =========================================================
   QUESTION BUTTONS
========================================================= */

function buildQuestionButtons() {

    const container =
        document.getElementById(
            "questionButtons"
        );


    container.innerHTML = "";


    questions.forEach(
        function (
            question,
            index
        ) {

            const button =
                document.createElement(
                    "button"
                );


            button.type =
                "button";


            button.className =
                "question-button";


            button.innerText =
                index + 1;


            button.onclick =
                function () {

                    currentQuestion =
                        index;

                    showQuestion();

                };


            container.appendChild(
                button
            );

        }
    );

}


/* =========================================================
   SHOW QUESTION
========================================================= */

function showQuestion() {

    const question =
        questions[
            currentQuestion
        ];


    if (!question) {
        return;
    }


    document.getElementById(
        "questionNumber"
    ).innerText =
        "QUESTION " +
        (currentQuestion + 1) +
        " OF " +
        questions.length;


    document.getElementById(
        "questionText"
    ).innerText =
        question.question ||
        "Question unavailable";


    const optionsContainer =
        document.getElementById(
            "options"
        );


    optionsContainer.innerHTML =
        "";


    const optionData =
        question.options || {};


    Object.keys(
        optionData
    ).forEach(
        function (letter) {

            const option =
                document.createElement(
                    "div"
                );


            option.className =
                "option";


            if (
                answers[
                    currentQuestion
                ] === letter
            ) {

                option.classList.add(
                    "selected"
                );

            }


            option.innerHTML = `

                <div class="option-letter">
                    ${escapeHTML(letter)}
                </div>

                <div class="option-text">
                    ${escapeHTML(
                        optionData[letter]
                    )}
                </div>

            `;


            option.onclick =
                function () {

                    selectAnswer(
                        letter
                    );

                };


            optionsContainer.appendChild(
                option
            );

        }
    );


    updateQuestionButtons();

    updateNavigation();

    updateExamStatus();

}


/* =========================================================
   SELECT ANSWER
========================================================= */

function selectAnswer(letter) {

    answers[
        currentQuestion
    ] = letter;


    showQuestion();

}


/* =========================================================
   QUESTION NAVIGATION
========================================================= */

function nextQuestion() {

    if (
        currentQuestion <
        questions.length - 1
    ) {

        currentQuestion++;

        showQuestion();

    }

}


function previousQuestion() {

    if (
        currentQuestion > 0
    ) {

        currentQuestion--;

        showQuestion();

    }

}


/* =========================================================
   QUESTION BUTTON STATE
========================================================= */

function updateQuestionButtons() {

    const buttons =
        document.querySelectorAll(
            ".question-button"
        );


    buttons.forEach(
        function (
            button,
            index
        ) {

            button.classList.remove(
                "current",
                "answered"
            );


            if (
                index ===
                currentQuestion
            ) {

                button.classList.add(
                    "current"
                );

            }


            else if (
                answers[index]
            ) {

                button.classList.add(
                    "answered"
                );

            }

        }
    );

}


/* =========================================================
   NAVIGATION BUTTONS
========================================================= */

function updateNavigation() {

    const previous =
        document.getElementById(
            "previousButton"
        );


    const next =
        document.getElementById(
            "nextButton"
        );


    previous.disabled =
        currentQuestion === 0;


    next.innerText =
        currentQuestion ===
        questions.length - 1

            ? "Finish →"

            : "Next →";

}


/* =========================================================
   STATUS
========================================================= */

function updateExamStatus() {

    const answered =
        Object.keys(
            answers
        ).length;


    document.getElementById(
        "examStatus"
    ).innerText =
        answered +
        " of " +
        questions.length +
        " answered";

}


/* =========================================================
   TIMER
========================================================= */

function startTimer() {

    updateTimerDisplay();


    timerInterval =
        setInterval(
            function () {

                remainingSeconds--;


                updateTimerDisplay();


                if (
                    remainingSeconds <= 0
                ) {

                    clearInterval(
                        timerInterval
                    );

                    clearInterval(
                        trustPollInterval
                    );


                    alert(
                        "Time is up. Your examination will be submitted."
                    );


                    submitExam();

                }

            },
            1000
        );

}


function updateTimerDisplay() {

    const minutes =
        Math.floor(
            remainingSeconds / 60
        );


    const seconds =
        remainingSeconds % 60;


    document.getElementById(
        "timerValue"
    ).innerText =

        String(minutes)
            .padStart(2, "0")

        + ":" +

        String(seconds)
            .padStart(2, "0");


    if (
        remainingSeconds <= 60
    ) {

        document.getElementById(
            "examTimer"
        ).classList.add(
            "timer-warning"
        );

    }

}


/* =========================================================
   SUBMIT
========================================================= */

async function submitExam() {

    /*
     * Prevent accidental double submission.
     */
    if (window.examSubmitting) {
        return;
    }

    const answered =
        Object.keys(
            answers
        ).length;

    const confirmed =
        window.confirm(

            "You have answered " +
            answered +
            " of " +
            questions.length +
            " questions.\\n\\n" +
            "Submit this examination?"

        );

    if (!confirmed) {
        return;
    }

    window.examSubmitting = true;

    clearInterval(
        timerInterval
    );

    /*
     * Disable the submit button while the request
     * is being processed.
     */
    const submitButton =
        document.querySelector(
            ".submit-button"
        );

    if (submitButton) {
        submitButton.disabled = true;
        submitButton.innerText =
            "Submitting...";
    }

    try {

        /*
         * Send ONLY the student's answers.
         *
         * The backend obtains the authenticated
         * student_id from the Flask session and
         * verifies the exam assignment in MySQL.
         */
        const response =
            await fetch(
                "/api/exams/" +
                encodeURIComponent(
                    examId
                ) +
                "/submit",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    credentials: "same-origin",

                    body: JSON.stringify({
                        answers: answers
                    })
                }
            );

        const data =
            await response.json();

        if (!response.ok || !data.success) {

            throw new Error(
                data.error ||
                "Unable to submit examination."
            );

        }

        const submission =
            data.submission || {};

        /*
         * The backend decides whether the result is
         * automatically evaluated or sent for teacher review.
         */
        if (
            String(
                submission.status || ""
            ).toUpperCase() ===
            "PENDING_REVIEW"
        ) {

            alert(
                "Your examination has been submitted.\\n\\n" +
                "Your Trust Score is below the automatic evaluation threshold, " +
                "so your result has been sent for teacher review."
            );

        } else {

            alert(
                "Examination submitted successfully.\\n\\n" +
                "Score: " +
                (
                    submission.score !== null &&
                    submission.score !== undefined
                        ? submission.score
                        : "Pending"
                ) +
                "%\\n" +
                "Trust Score: " +
                (
                    submission.trust_score !== null &&
                    submission.trust_score !== undefined
                        ? submission.trust_score
                        : "--"
                )
            );

        }

/*
 * The MySQL submission has been successfully committed.
 *
 * Now stop the LOCAL AI monitoring agent.
 * This terminates live_monitor.py, releases the
 * camera/microphone, and stops the video relay.
 */
try {
    await fetch(
        STUDENT_AGENT_URL + "/stop",
        {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({})
        }
    );

    console.log(
        "PROCTIFY monitoring stopped after exam submission."
    );

} catch (stopError) {

    /*
     * Do not mark the exam submission as failed
     * if the local agent is already stopped or
     * temporarily unreachable.
     */
    console.warn(
        "Unable to contact local monitoring agent:",
        stopError
    );
}

/*
 * Give the agent a moment to terminate the monitor
 * before returning to the student dashboard.
 */
await new Promise(
    resolve => setTimeout(resolve, 500)
);

window.location.href =
    "/student";

    }

    catch (error) {

        console.error(
            "Exam submission error:",
            error
        );

        window.examSubmitting = false;

        if (submitButton) {
            submitButton.disabled = false;
            submitButton.innerText =
                "Submit Exam";
        }

        alert(
            error.message ||
            "Unable to submit examination. Please try again."
        );

    }

}


/* =========================================================
   HTML ESCAPING
========================================================= */

function escapeHTML(value) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================================================
   START
========================================================= */

loadExam();

/*
 * BFCache / pageshow guard.
 * When the browser restores this page from back-forward cache,
 * revalidate with the server.  If the exam was already
 * submitted or terminated, redirect immediately.
 */
window.addEventListener("pageshow", function (event) {
    if (event.persisted) {
        window.location.reload();
    }
});

/*
 * Popstate guard — if the user navigates back/forward,
 * reload to force server-side state check.
 */
window.addEventListener("popstate", function () {
    window.location.reload();
});

</script>
